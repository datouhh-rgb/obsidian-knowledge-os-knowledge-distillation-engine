name: V3.1.1 LTS Cross-Platform Gate

on:
  workflow_dispatch:

jobs:
  safety:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test]

      - name: Full pytest suite
        id: full
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee full-pytest.log

      - name: Exposure create/discover/remove/recreate
        id: exposure
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_exposure.py tests/test_exposure_cross_platform.py 2>&1 | tee exposure.log

      - name: Migration dry-run/apply/rollback
        id: migration
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_chunking_migration.py::test_v2_migration_dry_run_apply_rollback_and_idempotency 2>&1 | tee migration.log

      - name: Symlink and path handling
        id: path
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_symlink_cleanup.py tests/test_security.py::test_pdf_outside_workdir_is_blocked 2>&1 | tee path.log

      - name: Build auditable matrix evidence
        if: always()
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
          EXPOSURE_OUTCOME: ${{ steps.exposure.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          PATH_OUTCOME: ${{ steps.path.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          logs = [Path(name) for name in ("full-pytest.log", "exposure.log", "migration.log", "path.log")]
          combined = b"".join(path.read_bytes() if path.is_file() else b"<missing>" for path in logs)
          def code(name):
              return 0 if os.environ.get(name) == "success" else 1
          payload = {
              "os": os.environ["MATRIX_OS"],
              "python": os.environ["MATRIX_PYTHON"],
              "pytest_exit_code": code("FULL_OUTCOME"),
              "exposure_exit_code": code("EXPOSURE_OUTCOME"),
              "migration_exit_code": code("MIGRATION_OUTCOME"),
              "path_exit_code": code("PATH_OUTCOME"),
              "raw_log_sha256": hashlib.sha256(combined).hexdigest(),
          }
          output = Path(".ci-evidence")
          output.mkdir()
          (output / "job.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          for log in logs:
              if log.is_file():
                  log.replace(output / log.name)
          PY

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lts-${{ matrix.os }}-py${{ matrix.python }}
          path: .ci-evidence/
          if-no-files-found: error

  lts-release-gate:
    name: Aggregate V3.1 LTS release gate
    if: always()
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .[test]
      - uses: actions/download-artifact@v4
        with:
          pattern: lts-*
          path: .ci-evidence/downloaded

      - name: Consolidate exact six-job evidence
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          jobs = [json.loads(path.read_text()) for path in sorted(Path(".ci-evidence/downloaded").glob("**/job.json"))]
          payload = {
              "schema_version": 1,
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "jobs": jobs,
          }
          Path(".ci-evidence/cross-platform-evidence.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Final fail-closed LTS check
        run: python scripts/final_lts_check.py --cross-platform-evidence .ci-evidence/cross-platform-evidence.json

      - name: Upload final LTS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3.1.1-final-lts-report
          path: |
            FINAL_LTS_REPORT.md
            FINAL_LTS_AUDIT/
            .ci-evidence/cross-platform-evidence.json
