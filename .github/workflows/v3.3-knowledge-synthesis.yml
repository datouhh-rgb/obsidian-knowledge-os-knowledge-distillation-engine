name: V3.3 Final Production Acceptance

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    name: portable-core / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Editable install
        run: python -m pip install -e .
      - name: Authoritative schema drift gate
        run: python scripts/export_schemas.py --check
      - name: Portable unit and integration suite
        run: python -m pytest -q -m "not real_codex" --ignore=tests/test_clean_install_environment.py
      - name: Local production contracts
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
        run: python scripts/final_production_check.py --local-only --skip-tests --json-out .ci-evidence/engine-job.json
      - name: Exact-byte staging manifest test
        run: python -m pytest -q tests/test_schema_manifest_remediation.py
      - name: Windows Python 3.12 Vault-lock contention diagnostics
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        run: python scripts/vault_lock_stress.py --rounds 20 --output .ci-evidence/vault-lock-stress.json
      - name: Write immutable portable evidence
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, platform, sys
          from pathlib import Path
          payload = {
              "schema_version": 2,
              "layer": "portable-core",
              "os": os.environ["MATRIX_OS"],
              "runner_os": platform.platform(),
              "python": os.environ["MATRIX_PYTHON"],
              "python_runtime": sys.version,
              "commit_sha": os.environ["COMMIT_SHA"],
              "workflow_url": os.environ["WORKFLOW_URL"],
              "schema_drift_status": "passed",
              "pytest_status": "passed",
              "manifest_staging_status": "passed",
              "production_check_status": "passed",
              "job_status": "passed",
          }
          path = Path(".ci-evidence/job.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .ci-evidence/job.json
            .ci-evidence/engine-job.json
            .ci-evidence/vault-lock-stress.json
            release/evidence/engine_gate/*.log
          if-no-files-found: error

  book-regression-windows:
    name: book-regression-windows / disposable Vaults
    needs: portable-core
    runs-on: [self-hosted, Windows, X64, knowledge-engine-release]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify self-hosted Python 3.12
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - run: python -m pip install -e .
      - name: Stock Operator canonical regression
        shell: powershell
        env:
          STOCK_SOURCE_B64: QzpcVXNlcnNcVGhpbmtQYWRcRG93bmxvYWRzXOiCoeelqOWkp+S9nOaJi+WbnuW/huW9lS5hencz
          STOCK_SNAPSHOT_B64: QzpcVXNlcnNcVGhpbmtQYWRcRG9jdW1lbnRzXENvZGV4XDIwMjYtMDgtMTFcb2JzaWRpYW4ta25vd2xlZGdlLW9zLWtub3dsZWRnZS1kaXN0aWxsYXRpb24tZW5naW5lXHdvcmtcY29udmVydGVkXOiCoeelqOWkp+S9nOaJi+WbnuW/huW9lS0tNzVkYmE4ODgubWQ=
        run: |
          $source = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:STOCK_SOURCE_B64))
          $snapshot = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:STOCK_SNAPSHOT_B64))
          $workDir = Join-Path $env:USERPROFILE ".cache\knowledge-engine-v33\stock-final"
          python scripts/run_stock_operator_regression.py `
            --source-azw3 "$source" `
            --conversion-snapshot "$snapshot" `
            --output release/evidence/regressions/stock_operator_v33_canonical.json `
            --work-dir "$workDir"
      - name: Cognitive Awakening canonical regression
        shell: powershell
        env:
          COGNITIVE_SOURCE_B64: QzpcVXNlcnNcVGhpbmtQYWRcRG93bmxvYWRzXOiupOefpeiniemGku+8muW8gOWQr+iHquaIkeaUueWPmOeahOWOn+WKqOWKmyso5ZGo5bKtKSsoWi1MaWJyYXJ5KS5wZGY=
          PDF_WRAPPER_B64: QzpcVXNlcnNcVGhpbmtQYWRcLmFnZW50c1xza2lsbHNccGRmLW1hcmtkb3duXHNjcmlwdHNcY29udmVydF9wZGYucHMx
        run: |
          $source = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:COGNITIVE_SOURCE_B64))
          $wrapper = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:PDF_WRAPPER_B64))
          $workDir = Join-Path $env:USERPROFILE ".cache\knowledge-engine-v33\cognitive-final"
          python scripts/run_cognitive_awakening_regression.py `
            --source-pdf "$source" `
            --pdf-wrapper "$wrapper" `
            --output release/evidence/regressions/cognitive_awakening_v33_canonical.json `
            --work-dir "$workDir"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-book-regressions
          path: release/evidence/regressions/*_canonical.json
          if-no-files-found: error

  real-codex-windows-e2e:
    name: real-codex-windows-e2e / explicit-only
    needs: [portable-core, book-regression-windows]
    runs-on: [self-hosted, Windows, X64, knowledge-engine-release]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify self-hosted Python 3.12
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: canonical-book-regressions
          path: release/evidence/regressions
      - name: Real Codex approved-only deployment and explicit call
        shell: powershell
        env:
          STOCK_SOURCE_B64: QzpcVXNlcnNcVGhpbmtQYWRcRG93bmxvYWRzXOiCoeelqOWkp+S9nOaJi+WbnuW/huW9lS5hencz
        run: |
          $source = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:STOCK_SOURCE_B64))
          python scripts/run_v33_real_codex_integration.py `
            --upstream-regression release/evidence/regressions/stock_operator_v33_canonical.json `
            --source-original "$source" `
            --concurrency 2
      - name: Revalidate raw transcript hashes
        run: python scripts/revalidate_v33_codex_audit.py
      - name: Dedicated live integration tests
        env:
          RUN_REAL_CODEX_TESTS: "1"
        run: python -m pytest -q -m real_codex -o addopts="--strict-markers"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-codex-explicit-only
          path: |
            release/evidence/codex_real_test
            release/SKILL_EXAMPLE
            history/V3.3_BLOCKED_Audit/real_codex_attempts
          if-no-files-found: warn

  release-assembly:
    name: release-assembly / immutable candidate
    if: always()
    needs: [portable-core, book-regression-windows, real-codex-windows-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: .ci-evidence/portable
      - uses: actions/download-artifact@v4
        with:
          name: canonical-book-regressions
          path: release/evidence/regressions
      - uses: actions/download-artifact@v4
        with:
          name: real-codex-explicit-only
          path: release
      - name: Aggregate one machine matrix source
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python scripts/aggregate_v33_release_evidence.py --portable-root .ci-evidence/portable --run-url "$RUN_URL" --commit "$COMMIT_SHA"
      - name: Render reports from canonical machine evidence
        run: python scripts/generate_v33_release_reports.py
      - name: Final fail-closed acceptance
        run: >-
          python scripts/final_v33_acceptance.py --skip-tests
          --ci-evidence release/evidence/ci/cross_platform_matrix.json
          --stock-regression release/evidence/regressions/stock_operator_v33_canonical.json
          --cognitive-regression release/evidence/regressions/cognitive_awakening_v33_canonical.json
      - name: Assemble exact-byte archive
        run: python scripts/assemble_v33_release.py --commit "${{ github.sha }}" --workflow-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v3.3.0-release-assembly-candidate
          path: |
            Obsidian-Knowledge-OS-Knowledge-Distillation-Engine-v3.3.0-Production-Ready.zip
            release/ZIP_SHA256.txt
            release/MANIFEST.sha256
            release/evidence
          if-no-files-found: error

  archive-verification:
    name: archive-verification / ${{ matrix.os }}
    needs: release-assembly
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: v3.3.0-release-assembly-candidate
          path: .release-candidate
      - name: Extract and verify exact final ZIP bytes
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/verify_v33_release_archive.py
          --archive .release-candidate/Obsidian-Knowledge-OS-Knowledge-Distillation-Engine-v3.3.0-Production-Ready.zip
          --expected-commit "$COMMIT_SHA"
          --workflow-url "$RUN_URL"
          --output .ci-evidence/archive-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: archive-verification-${{ matrix.os }}
          path: .ci-evidence/archive-verification.json
          if-no-files-found: error

  final-publication:
    name: final-publication / all gates
    needs: [release-assembly, archive-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: v3.3.0-release-assembly-candidate
          path: .release-candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-verification-*
          path: .ci-evidence/archive
      - name: Publish only after three-OS exact-byte verification
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/aggregate_v33_archive_verification.py
          --root .ci-evidence/archive
          --commit "$COMMIT_SHA"
          --workflow-url "$RUN_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: v3.3.0-production-ready-release
          path: |
            .release-candidate/Obsidian-Knowledge-OS-Knowledge-Distillation-Engine-v3.3.0-Production-Ready.zip
            .release-candidate/release/ZIP_SHA256.txt
            .release-candidate/release/MANIFEST.sha256
            release/evidence/ci/archive_cross_platform.json
          if-no-files-found: error
