name: V3.3 Knowledge Synthesis Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  production-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Clean editable install
        run: python -m pip install -e .
      - name: Full pytest
        id: pytest
        continue-on-error: true
        run: python -m pytest -q
      - name: Production check
        id: production
        continue-on-error: true
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
        run: python scripts/final_production_check.py --local-only --skip-tests --json-out .ci-evidence/engine-job.json
      - name: Build immutable job evidence
        if: always()
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pytest_pass = os.environ["PYTEST_OUTCOME"] == "success"
          production_pass = os.environ["PRODUCTION_OUTCOME"] == "success"
          payload = {
              "schema_version": 1,
              "os": os.environ["MATRIX_OS"],
              "python": os.environ["MATRIX_PYTHON"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "workflow_url": os.environ["WORKFLOW_URL"],
              "pytest_status": "passed" if pytest_pass else "failed",
              "production_check_status": "passed" if production_pass else "failed",
              "job_status": "passed" if pytest_pass and production_pass else "blocked",
          }
          output = Path(".ci-evidence/job.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload immutable job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v33-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .ci-evidence/job.json
            .ci-evidence/engine-job.json
            release/evidence/engine_gate/*.log
          if-no-files-found: error
      - name: Enforce matrix job
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path(".ci-evidence/job.json").read_text(encoding="utf-8"))
          raise SystemExit(0 if payload["job_status"] == "passed" else 1)
          PY

  production-release-gate:
    name: Aggregate exact six-environment evidence
    if: always()
    needs: production-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v33-*
          path: .ci-evidence/downloaded
      - name: Consolidate matrix evidence
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          jobs = [json.loads(path.read_text(encoding="utf-8")) for path in sorted(Path(".ci-evidence/downloaded").glob("**/job.json"))]
          payload = {
              "schema_version": 1,
              "workflow_url": os.environ["RUN_URL"],
              "jobs": jobs,
          }
          output = Path("release/evidence/ci/cross_platform_matrix.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Final V3.3 release decision
        run: python scripts/final_v33_acceptance.py --skip-tests --ci-evidence release/evidence/ci/cross_platform_matrix.json
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3.3-final-production-audit
          path: |
            release/evidence/ci/cross_platform_matrix.json
            release/evidence/final_gate/
          if-no-files-found: error
