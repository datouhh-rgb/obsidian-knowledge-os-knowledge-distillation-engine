name: V3.3 Knowledge Synthesis Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  production-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Clean editable install
        run: python -m pip install -e .
      - name: Full pytest
        run: python -m pytest -q
      - name: Production check
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
        run: python scripts/final_production_check.py --local-only --skip-tests --json-out .ci-evidence/job.json
      - name: Upload immutable job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v33-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .ci-evidence/job.json
            FINAL_PRODUCTION_AUDIT/*.log
          if-no-files-found: error

  production-release-gate:
    name: Aggregate exact six-environment evidence
    if: always()
    needs: production-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v33-*
          path: .ci-evidence/downloaded
      - name: Consolidate matrix evidence
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          jobs = [json.loads(path.read_text(encoding="utf-8")) for path in sorted(Path(".ci-evidence/downloaded").glob("**/job.json"))]
          compact = [{
              "os": item["matrix_os"], "python": item["matrix_python"],
              "commit_sha": item["commit_sha"], "status": item["status"],
              "pytest_exit_code": item["pytest_exit_code"], "checks": item["checks"],
          } for item in jobs]
          payload = {"schema_version": 1, "run_url": os.environ["RUN_URL"], "jobs": compact}
          output = Path(".ci-evidence/cross_platform_matrix.json")
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Final V3.3 release decision
        run: >-
          python scripts/final_production_check.py --skip-tests
          --ci-evidence .ci-evidence/cross_platform_matrix.json
          --regression-evidence FINAL_PRODUCTION_AUDIT/stock_operator_v33_regression.json
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3.3-final-production-audit
          path: |
            .ci-evidence/cross_platform_matrix.json
            FINAL_PRODUCTION_AUDIT/
          if-no-files-found: error
